name: adopti_mobile
description: Adopti mobile app - Arquitectura de Software 2026-I
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0
  graphql_flutter: ^5.2.0
  stomp_dart_client: ^2.1.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  google_sign_in: ^6.3.0
  firebase_messaging: ^15.2.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.1.0
  intl: ^0.20.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
